[project]
name = "sbx-browser"
version = "1.0.0"
description = "Durable coding Sessions with official CLI Harnesses and user-owned Executors"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0,<26",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "modal==1.5.5",
    "pydantic>=2.10.0",
    "psycopg[binary]>=3.2.0,<4",
    "cryptography>=46,<47",
    "uvicorn>=0.32.0",
    "websockets>=15,<16",
]

[dependency-groups]
dev = [
    "pyyaml>=6.0.2",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "pytest-xdist>=3.6,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
sbx = "sbx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["protocol", "control", "runtime", "src/sbx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit", "tests/integration"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["control", "runtime", "protocol", "src", "tests"]
extend-exclude = ["docs/archive"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
