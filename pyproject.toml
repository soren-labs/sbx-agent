[project]
name = "sbx-agent"
version = "0.1.3"
description = "Durable coding-agent Sessions running official provider CLIs (control plane + sbx-runtime + Console)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0,<26",
    # Unified vault: AES-256-GCM envelope encryption for CredentialVersions.
    "cryptography>=43",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    # Modal Executor (owner-bound clients); imported only in control/executors/modal.py.
    "modal>=1.5.5,<2",
    "pydantic>=2.10.0",
    "psycopg[binary]>=3.2.0,<4",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "pyyaml>=6.0.2",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
sbx = "sbx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["control", "protocol", "runtime", "src/sbx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit", "tests/integration"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["control", "protocol", "runtime", "src", "tests"]
# P0 spike is orchestrator-owned and not a CI dependency (SOR-43/44/45).
extend-exclude = ["spike"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Line length is enforced by `ruff format` for code; long literals are allowed.
ignore = ["E501"]
