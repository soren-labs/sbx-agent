[project]
name = "sbx-browser"
version = "0.1.0"
description = "Cursor Cloud Agent-style Codex cloud sessions (browser + control plane + sandbox runner)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "modal>=0.73.0",
    "pydantic>=2.10.0",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "pyyaml>=6.0.2",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["control", "runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["control", "runtime", "tests"]
# P0 spike is orchestrator-owned and not a CI dependency (SOR-43/44/45).
extend-exclude = ["spike"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
