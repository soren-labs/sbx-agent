name: sbx-staging

# Persistent staging stack for a 2 GiB VPS: PostgreSQL plus one control-plane
# container (API and in-process job workers). Images are built on GitHub
# Actions and pulled here; nothing is built, and no browser runs, on this host.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40
    environment:
      POSTGRES_DB: sbx
      POSTGRES_USER: sbx
      POSTGRES_PASSWORD: ${SBX_POSTGRES_PASSWORD:?SBX_POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: ${SBX_STAGING_POSTGRES_MEMORY:-512m}
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbx -d sbx"]
      interval: 5s
      timeout: 5s
      retries: 20

  sbx:
    image: ${SBX_IMAGE:?SBX_IMAGE is required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SBX_DATABASE_URL: postgresql://sbx:${SBX_POSTGRES_PASSWORD}@postgres:5432/sbx
      SBX_VAULT_KEYS: ${SBX_VAULT_KEYS:?SBX_VAULT_KEYS is required}
      SBX_RUNTIME_MASTER_KEY: ${SBX_RUNTIME_MASTER_KEY:?SBX_RUNTIME_MASTER_KEY is required}
      SBX_PUBLIC_URL: ${SBX_PUBLIC_URL:?SBX_PUBLIC_URL is required}
      SBX_ALLOWED_ORIGINS: ${SBX_ALLOWED_ORIGINS:?SBX_ALLOWED_ORIGINS is required}
      SBX_COOKIE_SECURE: ${SBX_COOKIE_SECURE:-1}
      # Agent execution happens on Modal. The local Executor would run
      # harness processes on this small host and is deliberately not enabled.
      SBX_EXECUTORS: ${SBX_EXECUTORS:-modal}
      SBX_DATA_DIR: /var/lib/sbx
      SBX_WORKER_THREADS: ${SBX_WORKER_THREADS:-2}
      SBX_RESEND_API_KEY: ${SBX_RESEND_API_KEY:-}
      SBX_MAIL_FROM: ${SBX_MAIL_FROM:-}
    volumes:
      - sbx_data:/var/lib/sbx
    ports:
      # Loopback only. The staging edge (Cloudflare Tunnel) or an SSH forward
      # connects here; the control plane is never bound to a public interface.
      - "127.0.0.1:8000:8800"
    mem_limit: ${SBX_STAGING_APP_MEMORY:-900m}
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8800/readyz"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

volumes:
  postgres_data:
  sbx_data:
