openapi: 3.1.0
info:
  title: sbx-browser Public API v1
  version: 1.0.0
  description: |
    公开 REST API，形状对齐 Cursor Cloud Agents API（设计 v2 §3.4）。
    `agent ≙ session`，`run ≙ turn`：创建 agent 立刻跑首个 run，follow-up
    是同一 agent 上的新 run。
    认证：`Authorization: Bearer sbx_<key>`（控制面只存 `sha256(key)`）。
    scopes：`agents`（默认）/ `admin`（accounts / api-keys / verify 需要）。
    错误体统一 `{error:{code, message, retryable, action, retry_after?,
    details?}}`（SOR-226）；`code` 取 canonical `error_subcodes`，`action`
    取 canonical `error_actions`，HTTP 状态取 canonical `error_codes`。
    Run 终态另带结构化 `error`（`RunError`：`code/source/message/retryable/
    retry_after?`），`code` 取 canonical `run_error_codes`，`source` 取
    `run_error_sources`；调用方无需解析 SSE 即可诊断失败主因。
    SSE 帧与 `/api/*` 相同：`id: <events.jsonl 行号>` / `event: <type>` /
    `data: <json>`，15 s `: keepalive`，支持 `Last-Event-ID` 续传。
x-canonical:
  error_codes: [400, 401, 403, 404, 409, 429, 500, 502, 503]
  run_error_codes:
    - auth_invalid
    - rate_limited
    - quota_exhausted
    - model_unavailable
    - model_capacity
    - provider_unavailable
    - runtime_error
    - event_parse_error
    - timeout
    - cancelled
    - contract_violation
  run_error_sources: [provider, runtime, control, telemetry]
  error_subcodes:
    - account_busy
    - account_exists
    - account_not_found
    - account_unavailable
    - artifact_invalid
    - artifact_not_found
    - artifact_secret
    - base_sha_mismatch
    - checkout_failed
    - checksum_mismatch
    - concurrency_limit
    - connect_failed
    - delivery_failed
    - delivery_not_found
    - forbidden
    - github_app_configured
    - github_app_invalid
    - github_app_state
    - github_app_unconfigured
    - github_app_upstream
    - grant_invalid
    - head_sha_mismatch
    - idempotency_conflict
    - idempotency_in_progress
    - independence_violation
    - internal
    - invalid_account_id
    - invalid_blob
    - invalid_compute
    - invalid_output_contract
    - invalid_provider
    - invalid_request
    - invalid_resource
    - invalid_scope
    - invalid_source
    - merge_not_allowed
    - not_found
    - pair_invalid
    - provider_exhausted
    - provider_mismatch
    - repo_unavailable
    - review_required
    - review_stale
    - revision_not_found
    - revision_not_ready
    - schema_mismatch
    - session_active
    - session_not_found
    - session_not_runnable
    - task_active
    - task_not_retryable
    - turn_in_progress
    - unauthorized
    - unavailable
    - unknown_provider
    - unsafe_path
    - unsupported
    - workspace_invalid
    - workspace_not_found
    - workspace_unavailable
  error_actions: [authenticate, lookup, fix_request, wait, retry, configure]
  providers: [codex, antigravity, grok, opencode, devin]
  keepalives_s: 15
  sse:
    id: events.jsonl line number
    event: type
    data: json
    keepalive: ": keepalive"
  paths:
    - inbox/<n>.md
    - turns/<n>.json
    - events.jsonl
    - events.raw.jsonl
    - session.json
  exit_codes:
    "0": success
    "2": cli_nonzero
    "3": timeout
    "4": bad_json
    "5": auth_invalid
  commands:
    - init
    - turn
    - stop
    - export-credentials
  codex_events:
    - thread.started
    - turn.started
    - item.started
    - item.updated
    - item.completed
    - turn.completed
    - turn.failed
    - error
  item_types:
    - agent_message
    - command_execution
    - file_change
    - reasoning
    - error
  runner_events:
    - sbx.turn_started
    - sbx.turn_finished
    - sbx.error
    - sbx.session_meta
  usage_fields:
    - input_tokens
    - cached_input_tokens
    - output_tokens
  usage_fields_optional:
    - cache_write_input_tokens
    - reasoning_output_tokens
  http_paths:
    - POST /v1/agents
    - GET /v1/agents
    - GET /v1/agents/{id}
    - DELETE /v1/agents/{id}
    - POST /v1/agents/{id}/runs
    - GET /v1/agents/{id}/runs
    - GET /v1/agents/{id}/runs/{runId}
    - GET /v1/agents/{id}/runs/{runId}/stream
    - POST /v1/agents/{id}/runs/{runId}/cancel
    - GET /v1/agents/{id}/usage
    - GET /v1/workflows/{id}
    - DELETE /v1/workflows/{id}
    - GET /v1/models
    - GET /v1/providers
    - GET /v1/me
    - GET /v1/accounts
    - POST /v1/accounts
    - GET /v1/accounts/{id}
    - DELETE /v1/accounts/{id}
    - POST /v1/accounts/{id}/verify
    - GET /v1/api-keys
    - POST /v1/api-keys
    - DELETE /v1/api-keys/{id}
    - POST /v1/console/grant
    - POST /v1/console/exchange
    - GET /v1/agents/{id}/workspace
    - POST /v1/agents/{id}/workspace/review
    - POST /v1/agents/{id}/handoff
    - POST /v1/agents/{id}/git/publish
    - POST /v1/agents/{id}/git/merge
    - POST /v1/agents/{id}/artifacts
    - GET /v1/artifacts
    - GET /v1/artifacts/{artifactId}
    - GET /v1/artifacts/{artifactId}/download
    - GET /v1/github/app
    - POST /v1/github/app/authorize
    - POST /v1/github/app/authorize/callback
    - POST /v1/github/app/sync
    - DELETE /v1/github/app/installations/{installationId}
    - POST /v1/github/app/manifest
    - GET /v1/github/app/manifest/callback
    - POST /v1/github/app/manifest/complete
    - POST /v1/github/install
    - GET /v1/github/install/callback
    - GET /v1/auth
    - POST /v1/auth/connect
    - GET /v1/auth/connect/{sessionId}
    - POST /v1/auth/connect/{sessionId}/cancel
    - POST /v1/auth/connect/{sessionId}/retry
    - GET /v1/auth/pair/{ticket}
    - POST /v1/auth/pair/complete
    - POST /v1/tasks/preflight
    - POST /v1/tasks
    - GET /v1/tasks
    - GET /v1/tasks/{taskId}
    - GET /v1/tasks/{taskId}/runs
    - POST /v1/tasks/{taskId}/runs
    - POST /v1/tasks/{taskId}/cancel
    - POST /v1/tasks/{taskId}/retry
    - POST /v1/tasks/{taskId}/delivery
    - POST /v1/tasks/{taskId}/deliver
    - GET /v1/tasks/{taskId}/revisions
    - GET /v1/tasks/{taskId}/revisions/{ref}
    - GET /v1/tasks/{taskId}/reviews
    - POST /v1/tasks/{taskId}/reviews
    - POST /v1/tasks/{taskId}/merge
    - GET /v1/agents/{id}/revisions
    - GET /v1/agents/summary
    - POST /v1/models/refresh
    - GET /v1/accounts/{id}/lifecycle
    - POST /v1/accounts/{id}/lifecycle/refresh
    - GET /v1/openapi.json
servers:
  - url: https://sbx.sorenforge.com
    description: Production (Cloudflare Worker → sbx-control)
security:
  - bearerAuth: []
tags:
  - name: agents
  - name: tasks
  - name: runs
  - name: workspaces
  - name: artifacts
  - name: accounts
  - name: api-keys
  - name: console
  - name: github
  - name: auth
  - name: meta
paths:
  /v1/agents:
    post:
      tags: [agents]
      summary: Create an agent and immediately queue its first run
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAgentResponse"
        "400":
          $ref: "#/components/responses/InvalidProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/AccountUnavailable"
        "429":
          $ref: "#/components/responses/Exhausted"
    get:
      tags: [agents]
      summary: List agents
      operationId: listAgents
      parameters:
        - name: provider
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProviderId"
        - name: account_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgentStatus"
        - name: workflow_id
          in: query
          required: false
          description: |
            SOR-84 workflow scope filter: only agents whose persisted
            ``metadata.workflow_id`` binding (under the caller's key) matches.
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Agent page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/agents/summary:
    get:
      tags: [agents]
      summary: Lightweight agent status rollup (SOR-202)
      description: |
        Cheap alternative the Console polls instead of a full
        ``GET /v1/agents`` page: the same record-level filters apply, but
        no per-agent payload is built and no workflow-binding scan runs.
        ``version`` is ``{total}:{max updated_at}`` — refetch the full
        list only when it changes.
      operationId: agentsSummary
      parameters:
        - name: provider
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProviderId"
        - name: account_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgentStatus"
        - name: workflow_id
          in: query
          required: false
          description: |
            SOR-84 workflow scope filter: only agents whose persisted
            ``metadata.workflow_id`` binding (under the caller's key) matches.
          schema:
            type: string
      responses:
        "200":
          description: Agent rollup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/agents/{id}:
    get:
      tags: [agents]
      summary: Get agent detail
      operationId: getAgent
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [agents]
      summary: Close an agent (reclaim sandbox; history stays read-only)
      operationId: deleteAgent
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Closed agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/agents/{id}/workspace:
    get:
      tags: [workspaces]
      summary: Durable workspace record (SOR-83)
      description: |
        Declared base (`base_sha`/`base_ref`), the actual `checkout_sha` the
        sandbox stands on, current `head_sha`, and `reviewed_head_sha` — the
        commit an independent reviewer pinned. 404 `workspace_not_found`
        when the agent declared no workspace.
      operationId: getWorkspace
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Workspace record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/agents/{id}/workspace/review:
    post:
      tags: [workspaces]
      summary: Pin the reviewed head sha (SOR-83)
      description: |
        Records `reviewed_head_sha` — the exact commit a reviewer signed
        off. `head_sha` omitted means "the recorded head"; an explicit value
        that disagrees with it is an explicit 409 `head_sha_mismatch`,
        never a silent mislabel. `comment` (SOR-128) additionally posts a
        machine-readable comment on the workspace's recorded pull request —
        never a formal GitHub review approval: every sandbox shares one
        GitHub identity, so an approval would read as the PR author
        approving their own work. Commenting requires the agent's live
        sandbox and the opt-in GitHub bridge.
      operationId: reviewWorkspace
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewWorkspaceRequest"
      responses:
        "200":
          description: Updated workspace record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/WorkspaceConflict"
  /v1/agents/{id}/handoff:
    post:
      tags: [workspaces]
      summary: Apply a cross-agent handoff into a live workspace (SOR-83/SOR-128)
      description: |
        Exactly one of `artifact_id` / `head_sha` / `pull_request`.
        `artifact_id` applies a durable artifact package after validating
        repo identity, payload checksum and that the workspace stands
        exactly on the artifact's declared `base_sha`; `head_sha` checks
        out an exact commit that must descend from the declared base;
        `pull_request` fetches a remote ref pinned to an exact head — a ref
        that drifted since the pin fails closed as 409 `head_sha_mismatch`
        (SOR-128 reviewer start). `workspace` supplies a WorkspaceDecl only
        when the agent has no recorded workspace yet. The agent must be
        `idle` with a live sandbox — a running turn is 409
        `turn_in_progress`; a base gap is 409 `base_sha_mismatch`.
      operationId: applyHandoff
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoffRef"
      responses:
        "200":
          description: Workspace record after the handoff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/InvalidProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/WorkspaceConflict"
  /v1/agents/{id}/git/publish:
    post:
      tags: [workspaces]
      summary: Publish the work branch per the declared git policy (SOR-128)
      description: |
        Executes the `git` policy declared at agent create: refreshes the
        recorded head, pushes the work branch to the workspace repo's
        remote and verifies the remote resolved to exactly the pushed head
        — drift fails closed as 409 `repo_unavailable`. When the policy's
        `auto_create_pr` is set, opens the pull request to `target` via the
        opt-in GitHub bridge and records structured `pull_request`
        metadata. `pushed_head_sha`/`pull_request` persist on the durable
        workspace record so a reviewer can pin the exact published head.
        The agent must be `idle` with a live sandbox; an agent without a
        push-enabled `git` policy is 400 `workspace_invalid`.
      operationId: publishGit
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Workspace record after publish
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/InvalidProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/WorkspaceConflict"
  /v1/agents/{id}/git/merge:
    post:
      tags: [workspaces]
      summary: Merge the recorded pull request — review-gated (SOR-178)
      description: |
        Merges the pull request recorded on the workspace. Requires the
        `git.merge` flag declared at create, a recorded `pull_request`, and
        an independent exact-sha review pin (`reviewed_head_sha` set via
        `POST /v1/agents/{id}/workspace/review`): no pin is 409
        `review_required`; the recorded PR head and the remote PR ref must
        both still equal the pin — any drift is 409 `head_sha_mismatch`
        and requires a fresh review. The merge is issued to GitHub with
        the pinned sha as its required-head check, so it also fails
        closed server-side. Durable `merge` metadata (`merge_commit_sha`,
        `head_sha`, `merged_at`) is persisted on the workspace record.
        The agent must be `idle` with a live sandbox; an agent without a
        merge-enabled `git` policy or recorded PR is 400
        `workspace_invalid`.
      operationId: mergeGit
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Workspace record after merge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/InvalidProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/WorkspaceConflict"
  /v1/agents/{id}/artifacts:
    post:
      tags: [artifacts]
      summary: Snapshot the agent's workspace into a durable artifact (SOR-83)
      description: |
        Collects the declared workspace while the sandbox is still alive so
        the package outlives teardown. The manifest records base/head shas,
        per-file sha256, producer identity and any `test_command` result;
        the package members are `manifest.json`, `patch.diff` (working-tree
        delta vs `checkout_sha`), `repo.bundle` when the worktree is clean
        and HEAD moved, and `files/<path>` for every collected file.
        `run_id` (default: the last run) gets an `artifact://<id>` ref on
        its durable run record. Secret material in scope fails closed:
        409 `artifact_secret`, nothing persisted.
      operationId: createArtifact
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateArtifactRequest"
      responses:
        "201":
          description: Artifact manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/WorkspaceConflict"
  /v1/agents/{id}/revisions:
    get:
      tags: [agents]
      summary: List the agent's durable revisions (SOR-225)
      operationId: listAgentRevisions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AgentId"
      responses:
        "200":
          description: Revision list (per-agent ``n`` order)
          content:
            application/json:
              schema:
                type: object
                required: [revisions]
                properties:
                  revisions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Revision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/artifacts:
    get:
      tags: [artifacts]
      summary: List durable artifact manifests (SOR-83; paginated SOR-201)
      description: |
        `agent_id` filters by producing agent through the durable
        per-agent index — a filtered listing never scans the full
        artifact store. `limit` + `cursor` page the
        `(created_at, artifact_id)` keyset; `next_cursor` in the
        response resumes the listing and is null at the end. Omit both
        to get the complete (unpaginated) listing, as before.
      operationId: listArtifacts
      parameters:
        - name: agent_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by producing agent.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque keyset cursor from a prior `next_cursor`.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
          description: Max artifacts per page.
      responses:
        "200":
          description: Artifact manifests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/artifacts/{artifactId}:
    get:
      tags: [artifacts]
      summary: Artifact manifest detail (SOR-83)
      operationId: getArtifact
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: Artifact manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/WorkspaceConflict"
  /v1/artifacts/{artifactId}/download:
    get:
      tags: [artifacts]
      summary: Download one package member (SOR-83)
      description: |
        Raw bytes of `manifest.json`, `patch.diff`, `repo.bundle` or
        `files/<path>`; checksum-verified on read. Served from the durable
        store — works after the producing sandbox is reclaimed.
      operationId: downloadArtifact
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
        - name: member
          in: query
          required: false
          schema:
            type: string
            default: patch.diff
      responses:
        "200":
          description: Member bytes (`application/octet-stream`)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/WorkspaceConflict"
  /v1/agents/{id}/runs:
    post:
      tags: [runs]
      summary: Follow-up run on an existing agent
      operationId: createRun
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "201":
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Agent already running (`turn_in_progress`) or closed (`session_not_runnable`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    get:
      tags: [runs]
      summary: List runs of an agent
      operationId: listRuns
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Run list
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/agents/{id}/runs/{runId}:
    get:
      tags: [runs]
      summary: Get run status and result
      operationId: getRun
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/agents/{id}/runs/{runId}/stream:
    get:
      tags: [runs]
      summary: SSE stream of canonical events for this run
      operationId: streamRun
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/RunId"
        - name: Last-Event-ID
          in: header
          required: false
          description: events.jsonl 行号；从下一行续传
          schema:
            type: string
      responses:
        "200":
          description: |
            `text/event-stream`. Frames identical to `/api/sessions/{id}/events`:

            ```
            id: <events.jsonl 1-based line number>
            event: <type>
            data: <json>

            ```

            `: keepalive` comment on connect, then every 15 s.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/agents/{id}/runs/{runId}/cancel:
    post:
      tags: [runs]
      summary: Cancel a running run (= P1 stop)
      operationId: cancelRun
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run marked CANCELLED (or already terminal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/agents/{id}/usage:
    get:
      tags: [agents]
      summary: Accumulated usage and cost for an agent
      operationId: getAgentUsage
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Usage totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentUsage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/workflows/{id}:
    get:
      tags: [agents]
      summary: Workflow query / recover read (SOR-84)
      description: |
        Low-cost recovery view keyed by ``(caller key id, workflow_id)``:
        bound agents, their latest runs and artifact refs, plus aggregate
        progress — everything a fresh client process needs to resume
        polling/streaming after losing local state. Served from persisted
        records only; no sandbox I/O.
      operationId: getWorkflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workflow view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [agents]
      summary: Scoped workflow cleanup (SOR-84)
      description: |
        Close exactly the agents bound to ``(caller key id, workflow_id)`` —
        other workflows and other principals' sessions are never touched
        (the session owner is re-checked before close). Idempotent: a repeat
        call reports ``already_terminal`` instead of re-closing.
      operationId: deleteWorkflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cleanup outcome per scoped agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowCleanupResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tasks/preflight:
    post:
      tags: [tasks]
      summary: Advisory task resolution — no reservation, no side effects
      operationId: taskPreflight
      description: |
        SOR-222/SOR-223: resolves a task declaration (``prompt`` /
        ``source`` / ``execution`` / ``delivery``) without creating
        anything: canonicalizes the repo, resolves the default ref and
        exact base SHA, runs the GitHub authorization/permission
        preflight, and evaluates every account through the
        provider/model/effort/runtime/auth/health/capacity/capability
        filter before LRU ordering. Advisory only — ``POST /v1/tasks``
        revalidates and reserves authoritatively. Always 200 on a
        well-formed declaration; blockers surface as ``fail`` checks with
        the refusal code in ``error``.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "200":
          description: Resolution outcome (``ok:false`` when blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreflightResponse"
        "400":
          $ref: "#/components/responses/InvalidProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/tasks:
    post:
      tags: [tasks]
      summary: Create a task — validate, reserve a slot, queue the first run
      operationId: createTask
      description: |
        SOR-222/SOR-223: the caller-facing resource. The request never
        carries ``base_sha``, ``account_id`` pins, or git booleans — the
        control plane resolves source (canonical repo, default ref, exact
        base SHA) and execution (provider/model/effort/account through the
        capability-aware eligibility filter), persists "requested vs
        resolved" on the task record, and runs through the exact ``/v1``
        agent machinery. ``Idempotency-Key`` replays durably.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTaskResponse"
        "400":
          $ref: "#/components/responses/InvalidProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/AccountUnavailable"
        "429":
          $ref: "#/components/responses/Exhausted"
    get:
      tags: [tasks]
      summary: List the caller's tasks
      operationId: listTasks
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/tasks/{taskId}:
    get:
      tags: [tasks]
      summary: Task detail — requested vs resolved + live agent/run state
      operationId: getTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tasks/{taskId}/runs:
    get:
      tags: [tasks]
      summary: List the task's runs
      operationId: listTaskRuns
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task + runs
          content:
            application/json:
              schema:
                type: object
                required: [task, runs]
                properties:
                  task:
                    $ref: "#/components/schemas/Task"
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [tasks]
      summary: Queue a follow-up run on the task's agent
      operationId: createTaskRun
      description: |
        Durable ``QUEUED`` by default (``on_busy=queue``); ``on_busy=reject``
        surfaces a 409 when a turn is still in flight. Honors
        ``Idempotency-Key``.
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRunRequest"
      responses:
        "201":
          description: Follow-up run queued
          content:
            application/json:
              schema:
                type: object
                required: [task, run]
                properties:
                  task:
                    $ref: "#/components/schemas/Task"
                  run:
                    $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/InvalidProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/tasks/{taskId}/cancel:
    post:
      tags: [tasks]
      summary: Cancel the task's active run / queued work
      operationId: cancelTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task detail after cancel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/tasks/{taskId}/retry:
    post:
      tags: [tasks]
      summary: Retry a terminal task — delivery republish or a fresh run
      operationId: retryTask
      description: |
        ``mode=None`` picks by task state: ``delivery_failed`` retries the
        publish; a terminal run verdict re-runs the task's prompt (or the
        ``prompt`` override). ``on_busy`` applies to run-mode.
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryTaskRequest"
      responses:
        "200":
          description: Task detail after retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/InvalidProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/tasks/{taskId}/delivery:
    post:
      tags: [tasks]
      summary: Execute the task's delivery policy now (manual publish)
      operationId: triggerTaskDelivery
      description: |
        Create-or-update idempotent: replaying an already-delivered task
        returns its state; a missing delivery policy is a 409
        ``task_not_retryable``.
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task detail after the publish attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/tasks/{taskId}/deliver:
    post:
      tags: [tasks]
      summary: Materialize/deliver a revision — push payload + open/update the PR
      operationId: deliverTask
      description: |
        SOR-225: operates on the durable revision (artifact payload +
        recorded base/head) so it works after the author sandbox is gone.
        A failure persists ``delivery.status="failed"`` on the revision and
        surfaces as an explicit API error.
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliverRequest"
      responses:
        "200":
          description: Delivered revision
          content:
            application/json:
              schema:
                type: object
                required: [revision]
                properties:
                  revision:
                    $ref: "#/components/schemas/Revision"
        "400":
          $ref: "#/components/responses/InvalidProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/tasks/{taskId}/revisions:
    get:
      tags: [tasks]
      summary: List the task agent's durable revisions
      operationId: listTaskRevisions
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revision list (per-agent ``n`` order)
          content:
            application/json:
              schema:
                type: object
                required: [revisions]
                properties:
                  revisions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Revision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tasks/{taskId}/revisions/{ref}:
    get:
      tags: [tasks]
      summary: Resolve one revision — ``latest``, a ``rev-…`` id, or an ``n``
      operationId: getTaskRevision
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - name: ref
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resolved revision
          content:
            application/json:
              schema:
                type: object
                required: [revision]
                properties:
                  revision:
                    $ref: "#/components/schemas/Revision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tasks/{taskId}/reviews:
    get:
      tags: [tasks]
      summary: List the task's durable reviews
      operationId: listTaskReviews
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - name: revision
          in: query
          required: false
          schema:
            type: string
          description: Optional revision ref filter (``latest`` | ``rev-…`` | ``n``).
      responses:
        "200":
          description: Review list
          content:
            application/json:
              schema:
                type: object
                required: [reviews]
                properties:
                  reviews:
                    type: array
                    items:
                      $ref: "#/components/schemas/Review"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [tasks]
      summary: Record a durable review on a revision
      operationId: createTaskReview
      description: |
        ``reviewer.identity`` defaults to the calling API key. Independence
        is computed at write time — a reviewer equal to the revision's own
        agent or run never satisfies the merge gate. ``comment`` posts a
        machine-readable comment on the delivered pull request.
        ``Idempotency-Key`` replays durably like task/run create.
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "201":
          description: Recorded review
          content:
            application/json:
              schema:
                type: object
                required: [review]
                properties:
                  review:
                    $ref: "#/components/schemas/Review"
        "400":
          $ref: "#/components/responses/InvalidProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/tasks/{taskId}/merge:
    post:
      tags: [tasks]
      summary: Merge a delivered revision's pull request
      operationId: mergeTask
      description: |
        SOR-225 merge gate: requires a delivered revision, an independent
        approving review on the current head sha, and a mergeable PR —
        failures surface as explicit 409s (``review_required`` /
        ``independence_violation`` / ``review_stale`` …).
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeRequest"
      responses:
        "200":
          description: Merged revision
          content:
            application/json:
              schema:
                type: object
                required: [revision]
                properties:
                  revision:
                    $ref: "#/components/schemas/Revision"
        "400":
          $ref: "#/components/responses/InvalidProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/models:
    get:
      tags: [meta]
      summary: Discovered models + effort tiers per provider account
      operationId: listModels
      description: |
        SOR-204: rows are per (account, model) and come from the
        capability catalog — live CLI discovery with a TTL cache
        (`SBX_CAPABILITY_TTL_S`, default 300 s) and stale-last-good
        semantics, falling back to declared/env/static data until the
        first probe lands.
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items:
                      $ref: "#/components/schemas/Model"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/models/refresh:
    post:
      tags: [meta]
      summary: Synchronous capability refresh (admin scope)
      operationId: refreshModels
      description: |
        SOR-204: re-probes the provider CLIs of the matching accounts and
        returns the updated rows. Failed probes keep serving last-good
        data marked `stale` — refresh never empties the catalog.
      parameters:
        - name: provider
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProviderId"
        - name: account_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Refresh summary + updated model rows
          content:
            application/json:
              schema:
                type: object
                required: [refreshed, models]
                properties:
                  refreshed:
                    type: integer
                    minimum: 0
                    description: Number of accounts re-probed.
                  models:
                    type: array
                    items:
                      $ref: "#/components/schemas/Model"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/providers:
    get:
      tags: [meta]
      summary: Provider catalog + runtime readiness + account connection
      operationId: listProviders
      description: |
        SOR-212/SOR-215: every contract provider is listed — whether or not
        this deployment selects it and whether or not any account exists —
        split into three honest surfaces. `status: available` describes the
        supported-provider **catalog** only; it never infers `connected`
        from deployment config. `runtime` carries deploy-written readiness
        evidence (`ready`/`degraded`; `unknown` when the deployment predates
        the record, `disabled` when the provider is not selected by
        `SBX_PROVIDERS`). `connection` derives only from live account
        records: `not_connected` with zero accounts, `connected` when at
        least one account can take work, `degraded` when accounts exist but
        none is schedulable.
      responses:
        "200":
          description: Provider catalog rows
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Provider"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me:
    get:
      tags: [meta]
      summary: API key identity and scopes
      operationId: getMe
      responses:
        "200":
          description: Key info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
