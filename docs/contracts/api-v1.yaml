  /v1/api-keys:
    get:
      tags: [api-keys]
      summary: List API keys (admin scope; hashes only)
      operationId: listApiKeysV1
      responses:
        "200":
          description: API key list
          content:
            application/json:
              schema:
                type: object
                required: [api_keys]
                properties:
                  api_keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [api-keys]
      summary: Create an API key (admin scope; plaintext returned once)
      operationId: createApiKeyV1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Created; `key` is the only plaintext response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/api-keys/{id}:
    delete:
      tags: [api-keys]
      summary: Revoke an API key (admin scope)
      operationId: deleteApiKeyV1
      parameters:
        - $ref: "#/components/parameters/ApiKeyId"
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/console/grant:
    post:
      tags: [console]
      summary: |
        Mint a one-time, short-TTL Console handoff ticket (SOR-211). The
        caller's admin key stays in the `Authorization` header — only the
        opaque ticket enters the browser URL fragment, which is never sent
        to the server, so the long-lived bootstrap key never appears in a
        URL or access log.
      operationId: createConsoleGrant
      responses:
        "201":
          description: Grant ticket; redeem once via `/v1/console/exchange`
          content:
            application/json:
              schema:
                type: object
                required: [grant, expires_in, expires_at]
                properties:
                  grant:
                    type: string
                  expires_in:
                    type: integer
                  expires_at:
                    type: number
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/console/exchange:
    post:
      tags: [console]
      summary: |
        Redeem a one-time grant ticket for a minted admin+agents API key
        (SOR-211). Unauthenticated by design — the ticket itself is the
        credential — but single-use and ~120s TTL: an invalid, expired, or
        replayed ticket is a clean `401 grant_invalid`.
      operationId: exchangeConsoleGrant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant]
              properties:
                grant:
                  type: string
      responses:
        "201":
          description: Minted key; `key` is the only plaintext response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/github/install:
    post:
      tags: [github]
      summary: |
        Default Connect GitHub, step 1 (SOR-220): returns the URL the
        browser opens plus a single-use `state` credential. `mode` is
        `broker` (default): `authorize_url` is the official
        `github.com/apps/<public-sbx-app>/installations/new?state=...`
        page, resolved through the hosted Sorenforge integration broker —
        the first GitHub page the user sees is the App *installation*
        page, never `settings/apps/new`. `mode=app` is the local-App
        authorize fallback when the deployment runs its own App.
        Never returns private-key or token material.
      operationId: beginGitHubInstall
      responses:
        "201":
          description: Install URL + state issued
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url, mode]
                properties:
                  authorize_url:
                    type: string
                  state:
                    type: string
                  expires_at:
                    type: string
                  mode:
                    type: string
                    enum: [broker, app]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/GitHubAppUpstream"
        "503":
          $ref: "#/components/responses/GitHubAppUnconfigured"
  /v1/github/install/callback:
    get:
      tags: [github]
      summary: |
        Default Connect GitHub, step 2 (SOR-220): unauthenticated browser
        redirect target. The broker 302s here with a single-use `code`
        after the GitHub installation completes; exchanging it binds the
        installation (id/account/repo coverage) to this deployment and
        stores the broker credential in the protected lane. Exits 303 to
        `/#/admin/github?broker=connected` or `?broker_error=<code>`.
        Fail-closed: bad/expired/replayed codes never bind.
      operationId: githubInstallCallback
      parameters:
        - name: code
          in: query
          schema:
            type: string
      responses:
        "303":
          description: Redirect back to the Console GitHub view
  /v1/github/app:
    get:
      tags: [github]
      summary: |
        GitHub App authorization posture (SOR-177): whether the App is
        configured (`configured`, `app_slug`), how many installations are
        recorded, and whether the GH_TOKEN/GITHUB_TOKEN compatibility
        bridge can still supply tokens (`bridge_token`). Never returns
        private-key or token material.
      operationId: getGitHubAppStatus
      responses:
        "200":
          description: Authorization posture
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubAppStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/github/app/authorize:
    post:
      tags: [github]
      summary: |
        Begin one-click authorization (SOR-177): returns the GitHub App
        install URL to open in a browser plus a single-use `state`
        credential (600s TTL) that the callback requires.
      operationId: beginGitHubAppAuthorize
      responses:
        "201":
          description: Authorize URL + state issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubAppAuthorize"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/GitHubAppUnconfigured"
  /v1/github/app/authorize/callback:
    post:
      tags: [github]
      summary: |
        Complete authorization (SOR-177): records the installation the
        operator selected in the browser. `state` is the callback's
        credential — single-use, from the authorize step.
      operationId: completeGitHubAppAuthorize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubAppAuthorizeCallback"
      responses:
        "200":
          description: Installation recorded
          content:
            application/json:
              schema:
                type: object
                required: [installation]
                properties:
                  installation:
                    $ref: "#/components/schemas/GitHubAppInstallation"
        "400":
          $ref: "#/components/responses/GitHubAppInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/GitHubAppState"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/GitHubAppUpstream"
        "503":
          $ref: "#/components/responses/GitHubAppUnconfigured"
  /v1/github/app/sync:
    post:
      tags: [github]
      summary: |
        Refresh installation metadata from GitHub (admin scope): re-reads
        repo selection for every recorded installation and drops installs
        deleted on GitHub.
      operationId: syncGitHubApp
      responses:
        "200":
          description: Synced installation list
          content:
            application/json:
              schema:
                type: object
                required: [installations]
                properties:
                  installations:
                    type: array
                    items:
                      $ref: "#/components/schemas/GitHubAppInstallation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/GitHubAppUpstream"
        "503":
          $ref: "#/components/responses/GitHubAppUnconfigured"
  /v1/github/app/installations/{installationId}:
    delete:
      tags: [github]
      summary: |
        Revoke one installation (admin scope): best-effort delete on
        GitHub, then always forgets the local record and any cached
        installation tokens. Re-running authorize reconnects.
      operationId: revokeGitHubAppInstallation
      parameters:
        - name: installationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revocation outcome
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: integer
                  remote_deleted:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/GitHubAppUnconfigured"
  /v1/github/app/manifest:
    post:
      tags: [github]
      summary: |
        Zero-config registration, step 1 (SOR-220): returns the GitHub
        App manifest plus the `settings/apps/new` URL the browser POSTs
        it to, and a single-use `state` (600s TTL) binding the callback
        to this registration. Only for deployments with no App
        configured yet — 409 otherwise.
      operationId: beginGitHubAppManifest
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                org:
                  type: string
      responses:
        "201":
          description: Manifest + URL issued
          content:
            application/json:
              schema:
                type: object
                required: [manifest, manifest_url, state]
                properties:
                  manifest:
                    type: object
                  manifest_url:
                    type: string
                  state:
                    type: string
                  expires_at:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/GitHubAppConfigured"
  /v1/github/app/manifest/callback:
    get:
      tags: [github]
      summary: |
        Zero-config registration, step 2 (SOR-220): the unauthenticated
        browser redirect target GitHub sends the user to after the App is
        created. `code` + `state` come as query params; `state` is the
        single-use credential. Always answers 303 back to the Console
        GitHub view (`manifest=connected` or `manifest_error=<code>`).
      operationId: gitHubAppManifestCallback
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "303":
          description: Redirect back to the Console
  /v1/github/app/manifest/complete:
    post:
      tags: [github]
      summary: |
        Programmatic manifest completion (SOR-220) for API clients that
        collect the redirect themselves: `{"code", "state"}` — registers
        the App config into the integration registry (private material
        also mirrored to the deployment-managed Secret, best-effort) and
        returns metadata only.
      operationId: completeGitHubAppManifest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code:
                  type: string
                state:
                  type: string
      responses:
        "200":
          description: App registered
          content:
            application/json:
              schema:
                type: object
                required: [app_id, slug, name, source, secret]
                properties:
                  app_id:
                    type: string
                  slug:
                    type: string
                  name:
                    type: string
                  html_url:
                    type: string
                  source:
                    type: string
                    enum: [registry]
                  secret:
                    type: string
                    enum: [skipped, refreshed, failed]
        "400":
          $ref: "#/components/responses/GitHubAppInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/GitHubAppState"
  /v1/auth:
    get:
      tags: [auth]
      summary: |
        Provider Connect index (SOR-214): the canonical auth-session
        state vocabulary plus session-only terminals, and the live
        connect sessions.
      operationId: listAuthSessions
      responses:
        "200":
          description: State vocabulary + sessions
          content:
            application/json:
              schema:
                type: object
                required: [auth_states, connect_states, sessions]
                properties:
                  auth_states:
                    type: array
                    items:
                      type: string
                  connect_states:
                    type: array
                    items:
                      type: string
                  sessions:
                    type: array
                    items:
                      type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/auth/connect:
    post:
      tags: [auth]
      summary: |
        Begin a provider connect session (SOR-214). Hosted lane (the
        control plane can exec the provider login) surfaces
        `browser_url`/`user_code` live; the pair lane mints a single-use
        `pair_ticket` redeemed by `sbx auth pair <ticket>` on a machine
        that can run the vendor login. `account_id` relinks an existing
        account.
      operationId: beginAuthConnect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider:
                  $ref: "#/components/schemas/ProviderId"
                label:
                  type: string
                account_id:
                  type: string
                max_concurrent:
                  type: integer
                models:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Connect session opened
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/InvalidProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/auth/connect/{sessionId}:
    get:
      tags: [auth]
      summary: Connect session detail — state, URLs, error (SOR-214).
      operationId: getAuthConnectSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session detail
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/auth/connect/{sessionId}/cancel:
    post:
      tags: [auth]
      summary: Cancel an in-flight connect session; idempotent (SOR-214).
      operationId: cancelAuthConnect
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session after cancel
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/auth/connect/{sessionId}/retry:
    post:
      tags: [auth]
      summary: Re-open a terminal session as a fresh one (SOR-214).
      operationId: retryAuthConnect
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Fresh session opened
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/auth/pair/{ticket}:
    get:
      tags: [auth]
      summary: |
        Unauthenticated pair-ticket lookup (SOR-214): the local CLI's
        `sbx auth pair` learns which provider to log in. The single-use,
        short-TTL ticket itself is the credential — no Bearer key.
      operationId: getAuthPairInfo
      parameters:
        - name: ticket
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pair ticket info
          content:
            application/json:
              schema:
                type: object
                required: [provider, session_id]
                properties:
                  provider:
                    $ref: "#/components/schemas/ProviderId"
                  account_id:
                    type: string
                  relink:
                    type: boolean
                  session_id:
                    type: string
                  expires_at:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/pair/complete:
    post:
      tags: [auth]
      summary: |
        Consume a pair ticket and materialize the captured credential
        blob (SOR-214) — unauthenticated by design (the ticket is the
        credential). The blob is schema-validated before the ticket is
        consumed, so a bad blob is a retryable 400.
      operationId: completeAuthPair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, credential]
              properties:
                ticket:
                  type: string
                credential:
                  type: object
      responses:
        "200":
          description: Account materialized (+ cloud-verify verdict)
          content:
            application/json:
              schema:
                type: object
                required: [account_id, verified, connect]
                properties:
                  account_id:
                    type: string
                  verified:
                    type: boolean
                  connect:
                    type: object
                  session:
                    type: object
        "400":
          $ref: "#/components/responses/InvalidProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/openapi.json:
    get:
      tags: [meta]
      summary: Public OpenAPI document — generated from the live routes
      operationId: publicOpenapi
      description: |
        SOR-226: runtime-derived spec (FastAPI routes + Pydantic models +
        canonical error contract) — never a hand-maintained copy that can
        drift. Served unauthenticated: the spec names shapes, not secrets.
      responses:
        "200":
          description: This document
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer sbx_<key>`. Control plane stores
        `sha256(key)` only; plaintext is returned once at create time.
  parameters:
    AgentId:
      name: id
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ApiKeyId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
  schemas:
    ProviderId:
      type: string
      enum: [codex, antigravity, grok, opencode, devin]
    AgentStatus:
      type: string
      enum: [creating, idle, running, closed, timed_out, lost]
      description: Same enum as P1 session status.
    RunStatus:
      type: string
      enum: [CREATING, RUNNING, FINISHED, ERROR, CANCELLED, EXPIRED, UNKNOWN]
      description: |
        Cursor-shaped run state. Terminal states FINISHED/ERROR/CANCELLED/
        EXPIRED are persisted in the run ledger (SOR-82/A1) and never change
        once written — sandbox teardown cannot rewrite them. UNKNOWN means
        the run's outcome is unavailable (no persisted terminal state and no
        readable evidence); it is never inferred as success.
    Usage:
      type: object
      required: [input_tokens, cached_input_tokens, output_tokens]
      properties:
        input_tokens:
          type: integer
          minimum: 0
        cached_input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cache_write_input_tokens:
          type: integer
          minimum: 0
        reasoning_output_tokens:
          type: integer
          minimum: 0
    Prompt:
      type: object
      required: [text]
      properties:
        text:
          type: string
    AgentSpec:
      type: object
      required: [provider]
      properties:
        provider:
          $ref: "#/components/schemas/ProviderId"
        account_id:
          type: string
          description: Account id, or `"auto"` for scheduler pick (default).
          default: "auto"
        model:
          type: string
        reasoning_effort:
          type: string
          enum: [none, minimal, low, medium, high, xhigh, max]
          description: |
            SOR-179 canonical reasoning effort, agent-scoped: every run of
            the agent (first and follow-up turns, incl. provider resume)
            executes under this level. It maps to each provider's native
            effort surface; a provider/effort combination the provider
            cannot honor is refused as `400 unsupported` at create time —
            never silently ignored. `GET /v1/models` reports the levels
            each provider honors.
    CreateAgentRequest:
      type: object
      required: [prompt, agent]
      properties:
        prompt:
          $ref: "#/components/schemas/Prompt"
        agent:
          $ref: "#/components/schemas/AgentSpec"
        name:
          type: string
        idle_timeout_s:
          type: integer
          minimum: 1
        workspace:
          $ref: "#/components/schemas/WorkspaceDecl"
        handoff:
          $ref: "#/components/schemas/HandoffRef"
        git:
          $ref: "#/components/schemas/GitPolicy"
        metadata:
          $ref: "#/components/schemas/WorkflowMetadata"
        output_contract:
          $ref: "#/components/schemas/OutputContract"
        resources:
          $ref: "#/components/schemas/SessionResources"
        compute:
          $ref: "#/components/schemas/SessionCompute"
    SessionCompute:
      type: object
      description: |
        SOR-181 per-agent sandbox compute sizing — independent of
        `resources` (which names credential/config refs and must not
        carry sizing). `cpu` is a Modal core count or a `[min, max]`
        request/limit pair; `memory_mib` the same in MiB. Scalars pin
        `min == max`; omitted fields resolve to the canonical defaults
        (`cpu=[1, 2]`, `memory_mib=[1024, 8192]`), and an omitted
        `compute` resolves to the full defaults. Malformed, inverted
        (`min > max`), or out-of-bounds values fail as
        `invalid_compute`. The resolved spec is durable session state —
        it survives restarts and recovery, applies on sandbox create and
        snapshot restore, and the cost estimate bills at the declared
        request floor (`cpu[0]` / `memory_mib[0]`).
      properties:
        cpu:
          description: Core count or `[request, limit]` pair.
          anyOf:
            - type: number
              minimum: 0.125
              maximum: 64
            - type: array
              items:
                type: number
              minItems: 1
              maxItems: 2
        memory_mib:
          description: MiB or `[request, limit]` pair.
          anyOf:
            - type: integer
              minimum: 128
              maximum: 262144
            - type: array
              items:
                type: integer
              minItems: 1
              maxItems: 2
    SessionResources:
      type: object
      description: |
        SOR-129 per-agent resource refs declared at create time.
        `secrets` names Modal Secrets attached to this agent's sandbox
        only (allowlist-validated via `SBX_RESOURCE_SECRETS`; account
        `sbx-acct-*` and control-plane credential Secrets are refused as
        `invalid_resource`). `mcp` names MCP server entries in the
        deployment registry (`SBX_MCP_REGISTRY`); resolved config is
        written into the sandbox with `${env:VAR}` indirection — refs are
        names only, never values. MCP refs on a provider with no MCP
        channel (every provider except `devin`) fail as `unsupported`
        rather than being silently ignored. Unknown or disallowed refs
        fail as `invalid_resource`. Injected resources are never returned
        or logged as values and never baked into artifacts/snapshots.
      properties:
        secrets:
          type: array
          items:
            type: string
          description: Modal Secret names (allowlisted session resources).
        mcp:
          type: array
          items:
            type: string
          description: MCP server registry refs.
    OutputContract:
      type: object
      required: [schema]
      description: |
        SOR-130 structured output contract. `schema` is a JSON Schema the
        run's final agent message must satisfy — enforced subset only
        (assertion keywords; `pattern`, `$ref`, `if`/`then`/`else`,
        `patternProperties`, ... are refused as `400
        invalid_output_contract`). `enforcement` selects verdict handling:
        `strict` (default) turns invalid/malformed output into run `ERROR`
        + `contract_violation` — never a silent success; `warn` keeps the
        run `FINISHED` but attaches the same `contract_violation`
        diagnostic. The verdict is computed on the control plane from the
        recorded message and persisted on the terminal run as
        `output_contract` + `structured_output`.
      properties:
        schema:
          type: object
          description: JSON Schema (enforced subset) the output must satisfy.
        enforcement:
          type: string
          enum: [strict, warn]
          default: strict
    GitPolicy:
      type: object
      description: |
        SOR-128 git collaboration policy. Declares the work branch and how
        the head is published; requires a `workspace` declaration. `branch`
        materializes at prepare via `checkout -B` on the declared base.
        `push` publishes `HEAD` to `refs/heads/<branch>` on the workspace
        repo's remote via `POST /v1/agents/{id}/git/publish`; remote drift
        fails closed. `auto_create_pr` opens a PR to `target` through the
        opt-in GitHub bridge and requires `push`. `auto_publish` (SOR-178)
        publishes automatically when a run finishes successfully and
        requires `push`; `merge` allows `POST /v1/agents/{id}/git/merge`
        and requires `auto_create_pr` — the merge still refuses without an
        independent exact-sha review pin. GitHub-backed operations need
        the shared GitHub identity env (opt-in).
      properties:
        branch:
          type: string
          description: Work branch ref name; safe git ref chars only.
        push:
          type: boolean
          description: Publish the head to the remote work branch.
        auto_create_pr:
          type: boolean
          description: Open a pull request after push; requires `push`.
        auto_publish:
          type: boolean
          description: Publish automatically on successful run finish; requires `push`.
        merge:
          type: boolean
          description: Allow review-gated merge via `/git/merge`; requires `auto_create_pr`.
        target:
          type: string
          description: PR base branch; default the workspace `base_ref`.
        draft:
          type: boolean
          description: Open the pull request as a draft.
        title:
          type: string
          description: PR title; default "sbx/<agent_id>".
        body:
          type: string
          description: PR body text.
    WorkspaceDecl:
      type: object
      required: [repo, base_ref, base_sha]
      description: |
        SOR-83 workspace declaration. `base_sha` pins the exact commit the
        run must start on; `base_ref` names where it is expected to sit. A
        resolved `base_ref` that does not equal `base_sha` fails run-1 with
        an explicit `base_sha_mismatch` — the agent is closed rather than
        left running on the wrong version.
      properties:
        repo:
          type: string
          description: Clone URL or path the control plane clones.
        base_ref:
          type: string
        base_sha:
          type: string
          pattern: "^[0-9a-f]{40}$"
    PullRequestRef:
      type: object
      required: [ref, head_sha]
      description: |
        SOR-128 remote ref pinned to an exact head — the reviewer-start
        handoff. `ref` is fetched from the workspace repo's remote
        (`refs/pull/<n>/head`, `pull/<n>/head`, or a branch name); the
        resolved sha must equal `head_sha` exactly — drift fails closed as
        `head_sha_mismatch`.
      properties:
        ref:
          type: string
          description: Remote ref to fetch; safe git ref chars only.
        head_sha:
          type: string
          pattern: "^[0-9a-f]{40}$"
          description: Exact commit the ref must resolve to.
    HandoffRef:
      type: object
      description: |
        SOR-83/SOR-128 cross-agent handoff reference — exactly one of
        `artifact_id` / `head_sha` / `pull_request` required. On
        `POST /v1/agents` a `workspace` declaration must accompany the
        handoff; on `POST /v1/agents/{id}/handoff` `workspace` is only used
        when the agent has no recorded workspace yet.
      properties:
        artifact_id:
          type: string
          description: Durable artifact package to apply.
        head_sha:
          type: string
          pattern: "^[0-9a-f]{40}$"
          description: Exact commit to check out; must descend from base.
        pull_request:
          $ref: "#/components/schemas/PullRequestRef"
        workspace:
          $ref: "#/components/schemas/WorkspaceDecl"
    CreateArtifactRequest:
      type: object
      properties:
        run_id:
          type: string
          description: "Run to attach `artifact://<id>` to (default: last run)."
        test_command:
          type: string
          description: Command run in the workdir; exit code lands in the manifest.
    ReviewWorkspaceRequest:
      type: object
      properties:
        head_sha:
          type: string
          pattern: "^[0-9a-f]{40}$"
          description: |
            Exact commit the reviewer signed off; omitted pins the recorded
            head. A value that disagrees with the recorded head is an
            explicit `head_sha_mismatch`.
        comment:
          type: string
          minLength: 1
          description: |
            SOR-128 machine-readable review comment posted on the
            workspace's recorded pull request. Never a formal GitHub review
            approval — every sandbox shares one GitHub identity, so an
            approval would read as the PR author approving their own work.
            Requires a live sandbox and the opt-in GitHub bridge.
    WorkspaceRecord:
      type: object
      required: [agent_id, repo, base_ref, base_sha]
      properties:
        agent_id:
          type: string
        repo:
          type: string
        base_ref:
          type: string
        base_sha:
          type: string
        workdir:
          type: string
          description: Sandbox-root-relative workdir (default `repo`).
        checkout_sha:
          type: string
          nullable: true
          description: Commit the workspace actually stands on post-prepare.
        head_sha:
          type: string
          nullable: true
          description: Current workdir HEAD as last recorded by the control plane.
        reviewed_head_sha:
          type: string
          nullable: true
          description: Commit an independent reviewer pinned via `/workspace/review`.
        git:
          type: object
          nullable: true
          description: Resolved SOR-128 GitPolicy declared at create.
        branch:
          type: string
          nullable: true
          description: Work branch materialized from the git policy.
        pushed_head_sha:
          type: string
          nullable: true
          description: Exact head last pushed per the git policy.
        pull_request:
          type: object
          nullable: true
          description: |
            SOR-128 PR metadata recorded by publish: `number`, `url`,
            `state`, `ref` (`refs/pull/<n>/head` — the reviewer-start
            handoff ref), `head_sha` (the pinned published head), `base`
            (PR target), `draft`, `review_comment_url`.
        merge:
          type: object
          nullable: true
          description: |
            SOR-178 merge metadata recorded by `/git/merge`: `merged`,
            `merge_commit_sha`, `head_sha` (the reviewed head that was
            merged), `merged_at`.
        publish_error:
          type: string
          nullable: true
          description: |
            SOR-178 last publish failure (`<code>: <message>`), explicit
            or automatic — cleared on the next successful publish.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkspaceResponse:
      type: object
      required: [workspace]
      properties:
        workspace:
          $ref: "#/components/schemas/WorkspaceRecord"
    Artifact:
      type: object
      required: [artifact_id, format, created_at, producer, files, payloads]
      description: |
        Durable artifact manifest (SOR-83/B1). `payloads` maps member names
        (`patch.diff`, `repo.bundle`) to sha256; `files` lists collected
        workspace files with sha256+size. `download_url` serves any member
        (`manifest.json`, payload members, `files/<path>`).
      properties:
        schema_version:
          type: integer
        artifact_id:
          type: string
        format:
          type: string
          enum: [patch]
        base_sha:
          type: string
          description: Producer checkout_sha — the base the delta applies on.
        head_sha:
          type: string
          description: Producer HEAD at snapshot time.
        repo:
          type: string
        created_at:
          type: string
          format: date-time
        producer:
          type: object
          properties:
            agent_id:
              type: string
            run_id:
              type: string
              nullable: true
        files:
          type: array
          items:
            type: object
            required: [path, sha256, size]
            properties:
              path:
                type: string
              sha256:
                type: string
              size:
                type: integer
        tests:
          type: array
          items:
            type: object
            properties:
              command:
                type: string
              exit_code:
                type: integer
        payloads:
          type: object
          additionalProperties:
            type: string
          description: Member name → sha256.
        warnings:
          type: array
          items:
            type: string
        download_url:
          type: string
    ArtifactList:
      type: object
      required: [artifacts]
      properties:
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"
        next_cursor:
          type: string
          nullable: true
          description: Keyset cursor for the next page; null at the end.
    ArtifactResponse:
      type: object
      required: [artifact]
      properties:
        artifact:
          $ref: "#/components/schemas/Artifact"
    CreateAgentResponse:
      type: object
      required: [agent, run]
      properties:
        agent:
          $ref: "#/components/schemas/Agent"
        run:
          $ref: "#/components/schemas/Run"
    CreateRunRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          $ref: "#/components/schemas/Prompt"
        metadata:
          $ref: "#/components/schemas/WorkflowMetadata"
        output_contract:
          $ref: "#/components/schemas/OutputContract"
    WorkflowMetadata:
      type: object
      required: [workflow_id, task_id, role]
      description: |
        SOR-84 caller workflow binding. Persisted per agent, keyed by
        ``(api key id, workflow_id)``, so a fresh client can recover a
        workflow from nothing but its API key + ``workflow_id``.
      properties:
        workflow_id:
          type: string
          minLength: 1
          maxLength: 256
        task_id:
          type: string
          minLength: 1
          maxLength: 256
        role:
          type: string
          minLength: 1
          maxLength: 64
          description: Free-form label (``worker`` / ``reviewer`` / ...).
        parent_task_id:
          type: string
          maxLength: 256
          nullable: true
    Agent:
      type: object
      required:
        - id
        - name
        - provider
        - account_id
        - model
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          $ref: "#/components/schemas/ProviderId"
        account_id:
          type: string
        model:
          type: string
        reasoning_effort:
          type: string
          enum: [none, minimal, low, medium, high, xhigh, max]
          nullable: true
          description: |
            SOR-179: the canonical reasoning effort declared at create
            (inherited by every run), `null` when undeclared.
        status:
          $ref: "#/components/schemas/AgentStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        usage:
          $ref: "#/components/schemas/Usage"
          nullable: true
          description: |
            Token usage measured by runs; ``null`` while unmeasured —
            unavailable, never fabricated zeros (SOR-84).
        cost_estimate_usd:
          type: number
        metadata:
          $ref: "#/components/schemas/WorkflowMetadata"
          nullable: true
          description: The persisted workflow binding, when attached.
        resources:
          $ref: "#/components/schemas/SessionResources"
          nullable: true
          description: |
            SOR-129: the declared session-resource refs (names only —
            never values), ``null`` when the agent declared none.
        compute:
          $ref: "#/components/schemas/SessionCompute"
          nullable: true
          description: |
            SOR-181: the resolved compute spec the agent's sandbox was
            created with — ``{cpu: [min, max], memory_mib: [min, max]}``
            with the canonical defaults filled in, ``null`` only for
            records predating SOR-181.
    AgentList:
      type: object
      required: [agents]
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
        next_cursor:
          type: string
          nullable: true
    AgentSummary:
      type: object
      required: [total, live, by_status, version]
      properties:
        total:
          type: integer
        live:
          type: integer
          description: Agents in a non-ended status (creating / idle / running).
        by_status:
          type: object
          additionalProperties:
            type: integer
          description: Public status → count (`suspended` reports as `idle`).
        version:
          type: string
          description: "`{total}:{max updated_at}` — changes whenever the filtered set changes."
    Run:
      type: object
      required: [id, agent_id, status, created_at, updated_at]
      properties:
        id:
          type: string
        agent_id:
          type: string
        status:
          $ref: "#/components/schemas/RunStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        result:
          type: object
          nullable: true
          properties:
            text:
              type: string
        error:
          $ref: "#/components/schemas/RunError"
        usage:
          $ref: "#/components/schemas/Usage"
        provider:
          $ref: "#/components/schemas/ProviderId"
          nullable: true
        account_id:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        reasoning_effort:
          type: string
          enum: [none, minimal, low, medium, high, xhigh, max]
          nullable: true
          description: |
            SOR-179: the effective canonical effort the run executed
            under (the agent's declared level), `null` when undeclared.
        artifact_refs:
          type: array
          items:
            type: string
          description: |
            Sandbox-relative evidence paths for this run
            (``turns/<n>.json``, ``inbox/<n>.md``, ``events.jsonl``,
            ``events.raw.jsonl``). Refs may be dangling after the sandbox is
            reclaimed; the ledger record is the durable truth.
        structured_output:
          nullable: true
          description: |
            SOR-130: the JSON value extracted from the run's final agent
            message — any JSON type. ``null`` when the run carried no
            output contract or the message held no parseable JSON.
        output_contract:
          $ref: "#/components/schemas/OutputContractResult"
    RunError:
      type: object
      nullable: true
      required: [code, source, message, retryable]
      description: |
        结构化 run 失败原因（SOR-82）。`code` 为 canonical
        `run_error_codes`；`source` 区分 provider / runtime / control /
        telemetry；`message` 为脱敏后的诊断文本；`retryable` 表示换个时机
        （或换个账号/model）重试可能成功；`retry_after` 为 provider 给出的
        秒级重试提示（仅 `rate_limited` 等在可知时出现）。
        `event_parse_error` 表示事件流解析失败——除非执行完整性被独立确认，
        否则不得降级为 warning 或视为成功。持久化在 run ledger 上的错误
        使用同一 canonical 形状。
      properties:
        code:
          type: string
          enum:
            - auth_invalid
            - rate_limited
            - quota_exhausted
            - model_unavailable
            - model_capacity
            - provider_unavailable
            - runtime_error
            - event_parse_error
            - timeout
            - cancelled
            - contract_violation
        source:
          type: string
          enum: [provider, runtime, control, telemetry]
        message:
          type: string
        retryable:
          type: boolean
        retry_after:
          type: number
          description: Seconds; present when the provider supplied a retry hint
    OutputContractResult:
      type: object
      nullable: true
      required: [enforcement, status]
      description: |
        SOR-130 output-contract verdict persisted on a run. ``status`` is
        ``pending`` while the run is open, ``valid`` / ``invalid`` once the
        terminal verdict is evaluated, ``skipped`` when the run ended
        without evaluable output. ``violations`` is a bounded list of
        machine-diagnosable ``{path, code, message}`` entries — an
        ``invalid`` verdict under ``strict`` enforcement also surfaces as
        run ``ERROR`` + ``contract_violation``.
      properties:
        schema:
          type: object
          nullable: true
          description: The requested JSON Schema (echoed for diagnosis).
        enforcement:
          type: string
          enum: [strict, warn]
        schema_digest:
          type: string
          nullable: true
          description: '"sha256:<hex>" over the canonical schema.'
        status:
          type: string
          enum: [pending, valid, invalid, skipped]
        extraction:
          type: string
          nullable: true
          enum: [raw, fence, embedded]
          description: How the JSON value was recovered from the message.
        violations:
          type: array
          items:
            type: object
            required: [path, code, message]
            properties:
              path:
                type: string
              code:
                type: string
              message:
                type: string
    AgentUsage:
      type: object
      required: [usage, cost_estimate_usd, sandbox_seconds]
      properties:
        usage:
          $ref: "#/components/schemas/Usage"
          nullable: true
          description: "``null`` while no usage was ever measured (SOR-84)."
        cost_estimate_usd:
          type: number
        sandbox_seconds:
          type: number
    WorkflowAgent:
      type: object
      required: [agent_id, task_id, role, status, runs, latest_run]
      description: One bound agent inside a workflow view (SOR-84).
      properties:
        agent_id:
          type: string
        task_id:
          type: string
        role:
          type: string
        parent_task_id:
          type: string
          nullable: true
        attached_at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/AgentStatus"
          description: Session status; ``missing`` when the record is gone.
        provider:
          $ref: "#/components/schemas/ProviderId"
          nullable: true
        account_id:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        agent_created_at:
          type: string
          format: date-time
          nullable: true
        runs:
          type: integer
        latest_run:
          $ref: "#/components/schemas/Run"
          nullable: true
    Workflow:
      type: object
      required: [workflow_id, agents, progress]
      properties:
        workflow_id:
          type: string
        agents:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowAgent"
        progress:
          type: object
          required: [tasks, agents, open_agents, runs, latest_runs_by_status, all_terminal]
          properties:
            tasks:
              type: integer
            agents:
              type: integer
            open_agents:
              type: integer
            runs:
              type: integer
            latest_runs_by_status:
              type: object
              additionalProperties:
                type: integer
            all_terminal:
              type: boolean
    WorkflowCleanupResult:
      type: object
      required:
        - workflow_id
        - matched
        - closed
        - already_terminal
        - missing
        - skipped
        - errors
      properties:
        workflow_id:
          type: string
        matched:
          type: integer
        closed:
          type: array
          items:
            type: string
        already_terminal:
          type: array
          items:
            type: string
        missing:
          type: array
          items:
            type: string
        skipped:
          type: array
          items:
            type: string
          description: Agents whose session owner differs — never closed.
        errors:
          type: object
          additionalProperties:
            type: string
    Provider:
      type: object
      description: |
        SOR-212/SOR-215 — one supported provider: catalog truth plus the
        deployment's runtime readiness and live account connection.
      required: [provider, support, status, distribution, connection, runtime]
      properties:
        provider:
          $ref: "#/components/schemas/ProviderId"
        support:
          type: string
          description: Release support tier (stable | experimental).
        status:
          type: string
          enum: [available]
          description: |
            Catalog membership — always `available` for a supported
            provider; connection state lives under `connection`.
        distribution:
          type: object
          required: [kind, local_assisted]
          properties:
            kind:
              type: string
              enum: [npm, bundle, host-binary]
              description: |
                How the CLI reaches the image: `npm`/`bundle` are
                reproducible remote artifacts; `host-binary` is the
                local-assisted lane (build-host CLI, never blocks deploy).
            local_assisted:
              type: boolean
        cli:
          type: string
        cli_path:
          type: string
          description: In-image CLI binary path.
        credential_files:
          type: array
          items:
            type: string
          description: HOME-relative relpaths the credential blob restores.
        default_models:
          type: array
          items:
            type: string
        runtime:
          type: object
          required: [enabled, image, status]
          properties:
            enabled:
              type: boolean
              description: Whether this deployment selects the provider.
            image:
              type: string
              description: Published Modal image name.
            status:
              type: string
              enum: [ready, degraded, unknown, disabled]
              description: |
                Deploy-written evidence: `ready`/`degraded` from the image
                step; `unknown` when no record exists (pre-SOR-212
                deployments); `disabled` when not selected.
            version:
              type: string
              nullable: true
              description: Frozen CLI version from the deploy's lock.
            detail:
              type: string
            updated_at:
              type: string
              nullable: true
        connection:
          type: object
          required: [status, accounts_total, accounts_available]
          properties:
            status:
              type: string
              enum: [not_connected, connected, degraded]
            accounts_total:
              type: integer
              minimum: 0
            accounts_available:
              type: integer
              minimum: 0
              description: Active accounts with a free slot.
        summary:
          type: string
    Model:
      type: object
      required: [provider, model, accounts_available]
      properties:
        provider:
          $ref: "#/components/schemas/ProviderId"
        account:
          type: string
          description: SOR-204 — the account id this row was discovered on.
        model:
          type: string
        display_name:
          type: string
        family:
          type: string
          description: SOR-204 — product family inferred from the model id (e.g. `swe-2`, `gemini`).
        aliases:
          type: array
          items:
            type: string
          description: |
            SOR-204 — other ids that resolve to this model (e.g. the
            effort-stripped stem of `swe-2-high` is `swe-2`).
        accounts_available:
          type: integer
          minimum: 0
          description: Active accounts with a free slot that serve the model.
        availability:
          type: string
          enum: [available, busy, unavailable]
        reasoning_efforts:
          type: array
          items:
            type: string
            enum: [none, minimal, low, medium, high, xhigh, max]
          description: |
            SOR-204: canonical reasoning-effort levels the provider
            honors for this model, discovered or floor. Empty means the
            provider has no native effort surface — a declared
            `reasoning_effort` on agent create is refused as
            `unsupported`, never ignored.
        effort_native:
          type: object
          additionalProperties:
            type: string
          description: |
            SOR-204 — canonical level -> provider-native token the
            adapters emit on argv/config (identity when the CLI spells
            the canonical levels identically).
        default_effort:
          type: string
          enum: [none, minimal, low, medium, high, xhigh, max]
          nullable: true
          description: |
            SOR-204 — the effort the provider applies when none is
            declared (e.g. the tier encoded in `gemini-3.8-flash-low`).
        source:
          type: string
          enum: [discovered, declared, env, static]
          description: |
            SOR-204 — where this capability row came from: the live CLI
            probe, `account.models`, `SBX_<PROVIDER>_MODELS`, or the
            built-in provider defaults.
        refreshed_at:
          type: string
          format: date-time
          nullable: true
          description: SOR-204 — last successful live refresh; `null` for non-discovered rows.
        stale:
          type: boolean
          description: |
            SOR-204 — the row is last-good: the last refresh failed or
            the TTL expired. Stale rows are still servable.
    Me:
      type: object
      required: [key_id, scopes]
      properties:
        key_id:
          type: string
        label:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: [agents, admin]
    AccountStatus:
      type: string
      # SOR-216 verified-only lifecycle: `unverified` = credential declared
      # or imported but never proven by the cloud verify probe; an account
      # is scheduler-eligible only while `active` (a passing verify with
      # live evidence).
      enum: [active, cooling, invalid, disabled, unverified]
    AuthSessionState:
      type: string
      description: |
        Canonical auth-session state (SOR-213). Metadata only, derived from
        the account record + credential-lifecycle evidence: `verified` is
        the only scheduler-eligible state.
      enum:
        [
          unauthenticated,
          authenticating,
          authenticated,
          materialized,
          verified,
          reauth_required,
          unhealthy,
          disabled,
        ]
    Account:
      type: object
      required: [id, provider, label, status, max_concurrent]
      properties:
        id:
          type: string
        provider:
          $ref: "#/components/schemas/ProviderId"
        label:
          type: string
        status:
          $ref: "#/components/schemas/AccountStatus"
        auth_state:
          $ref: "#/components/schemas/AuthSessionState"
          nullable: true
        max_concurrent:
          type: integer
          minimum: 1
        running:
          type: integer
          minimum: 0
        models:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        cooldown_until:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          nullable: true
          description: REDACTED short code only, never credential material
    CreateAccountRequest:
      type: object
      required: [provider, label]
      properties:
        provider:
          $ref: "#/components/schemas/ProviderId"
        label:
          type: string
        credential:
          type: object
          description: |
            Credential blob `{"files": {"<relpath under HOME>": "<content>"}}`.
            Transported over HTTPS only; never logged or returned.
          properties:
            files:
              type: object
              additionalProperties:
                type: string
        max_concurrent:
          type: integer
          minimum: 1
        models:
          type: array
          items:
            type: string
    ApiKey:
      type: object
      required: [id, label, scopes, created_at]
      properties:
        id:
          type: string
        label:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: [agents, admin]
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
    CreateApiKeyRequest:
      type: object
      properties:
        label:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: [agents, admin]
          default: [agents]
    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: "`sbx_<key>` plaintext, returned exactly once"
    GitHubAppInstallation:
      type: object
      description: |
        Selected-repo authorization metadata for one GitHub App
        installation (SOR-177). Metadata only — never token material.
        `repositories` is populated only when `repository_selection` is
        `selected`; `all` covers every repo on the account.
      required: [installation_id, account_login, repository_selection, suspended]
      properties:
        installation_id:
          type: integer
        account_login:
          type: string
        account_type:
          type: string
          enum: [User, Organization]
        repository_selection:
          type: string
          enum: [all, selected]
        repositories:
          type: array
          items:
            type: string
        suspended:
          type: boolean
        recorded_at:
          type: string
          format: date-time
        synced_at:
          type: string
          format: date-time
        via:
          type: string
          description: |
            How the installation was bound: `broker` (SOR-220 default —
            the hosted Sorenforge broker mints its tokens) or empty/local
            (deployment's own App or authorize flow).
    GitHubAppStatus:
      type: object
      required: [configured, installable, installations, bridge_token]
      properties:
        configured:
          type: boolean
          description: |
            GitHub source configured — either a local App (id + private
            key) or at least one broker-bound installation.
        installable:
          type: boolean
          description: App slug also present (authorize URL can be built)
        app_id:
          type: string
          nullable: true
        app_slug:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
          description: |
            Where the effective GitHub identity lives: `env`
            (operator-supplied App envs), `registry` (manifest-registered
            App record), or `broker` (hosted broker on the public SBX
            App). Metadata only.
        broker:
          type: object
          description: |
            Broker lane status (SOR-220 default connect path): the broker
            URL this deployment is bound to, whether a binding exists,
            and a short-TTL cached health probe. Never carries
            credentials or key material.
          properties:
            url:
              type: string
            bound:
              type: boolean
            healthy:
              type: boolean
            app_slug:
              type: string
              nullable: true
        installations:
          type: array
          items:
            $ref: "#/components/schemas/GitHubAppInstallation"
        bridge_token:
          type: boolean
          description: |
            Whether the GH_TOKEN/GITHUB_TOKEN compatibility fallback can
            still supply tokens to the injection seam.
    GitHubAppAuthorize:
      type: object
      required: [authorize_url, state, expires_at]
      properties:
        authorize_url:
          type: string
          description: GitHub App install URL to open in a browser
        state:
          type: string
          description: Single-use callback credential (600s TTL)
        expires_at:
          type: string
          format: date-time
    GitHubAppAuthorizeCallback:
      type: object
      required: [installation_id, state]
      properties:
        installation_id:
          type: integer
        state:
          type: string
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable, action]
          properties:
            code:
              type: string
              enum:
                - account_busy
                - account_exists
                - account_not_found
                - account_unavailable
                - artifact_invalid
                - artifact_not_found
                - artifact_secret
                - base_sha_mismatch
                - checkout_failed
                - checksum_mismatch
                - concurrency_limit
                - connect_failed
                - delivery_failed
                - delivery_not_found
                - forbidden
                - github_app_configured
                - github_app_invalid
                - github_app_state
                - github_app_unconfigured
                - github_app_upstream
                - grant_invalid
                - head_sha_mismatch
                - idempotency_conflict
                - idempotency_in_progress
                - independence_violation
                - internal
                - invalid_account_id
                - invalid_blob
                - invalid_compute
                - invalid_output_contract
                - invalid_provider
                - invalid_request
                - invalid_resource
                - invalid_scope
                - invalid_source
                - merge_not_allowed
                - not_found
                - pair_invalid
                - provider_exhausted
                - provider_mismatch
                - repo_unavailable
                - review_required
                - review_stale
                - revision_not_found
                - revision_not_ready
                - schema_mismatch
                - session_active
                - session_not_found
                - session_not_runnable
                - task_active
                - task_not_retryable
                - turn_in_progress
                - unauthorized
                - unavailable
                - unknown_provider
                - unsafe_path
                - unsupported
                - workspace_invalid
                - workspace_not_found
                - workspace_unavailable
            message:
              type: string
            retryable:
              type: boolean
              description: "Whether the same request may be retried unchanged (honor `retry_after` when present)."
            action:
              type: string
              enum: [authenticate, lookup, fix_request, wait, retry, configure]
              description: "Client action hint: `authenticate` (fix credentials), `lookup` (verify the referenced id), `fix_request` (change the request), `wait` (retry after the busy object settles), `retry` (transient; resend), `configure` (operator setup required)."
            retry_after:
              type: number
              description: "Seconds; present on `provider_exhausted` / `concurrency_limit` / `task_active` when known."
            details:
              type: object
              description: "Optional structured context — e.g. `loc` lists the request fields that failed validation."
    TaskSource:
      type: object
      required: [repo]
      properties:
        repo:
          type: string
          description: |
            Git URL — ``https://github.com/<owner>/<repo>`` (incl. scp-style
            ``git@github.com:owner/repo``) is canonicalized; other hosts and
            ``file://``/local paths are accepted as-is.
        ref:
          type: string
          description: |
            ``auto``/``HEAD``/absent → the repo's default branch; a 40-hex
            sha pins an exact commit; any other git ref resolves to its sha.
    TaskExecution:
      type: object
      properties:
        provider:
          type: string
          description: |
            A canonical provider id or ``auto`` (default) — auto selects
            among eligible accounts of all enabled providers.
        account_id:
          type: string
          description: "``auto``/absent resolves through eligibility + LRU."
        model:
          type: string
          description: "``auto``/absent resolves via the capability surface."
        reasoning_effort:
          type: string
          description: |
            A canonical effort tier (none/minimal/low/medium/high/xhigh/max)
            or ``auto``/absent → the model's default effort.
    TaskPullRequest:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
        draft:
          type: boolean
          default: false
        target:
          type: string
          description: PR base branch; defaults to the resolved base ref.
    TaskDelivery:
      type: object
      properties:
        branch:
          type: string
          description: Work branch name; defaults to a derived ``sbx/…`` name.
        pull_request:
          $ref: "#/components/schemas/TaskPullRequest"
        auto_publish:
          type: boolean
          default: false
          description: Publish the work branch upstream on run completion.
    CreateTaskRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          $ref: "#/components/schemas/Prompt"
        name:
          type: string
        source:
          $ref: "#/components/schemas/TaskSource"
        execution:
          $ref: "#/components/schemas/TaskExecution"
        delivery:
          $ref: "#/components/schemas/TaskDelivery"
        metadata:
          $ref: "#/components/schemas/WorkflowMetadata"
        output_contract:
          $ref: "#/components/schemas/OutputContract"
        resources:
          $ref: "#/components/schemas/SessionResources"
        compute:
          $ref: "#/components/schemas/SessionCompute"
        idle_timeout_s:
          type: integer
          minimum: 1
    TaskCheck:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [pass, warn, fail]
        detail:
          type: string
    TaskCandidate:
      type: object
      description: |
        One evaluated account: eligibility plus the reason codes
        (``runtime_unavailable`` / ``no_credential`` / ``status_cooling`` /
        ``at_capacity`` / ``model_unresolvable`` / ``effort_unsupported`` …)
        that excluded it.
      properties:
        account_id:
          type: string
        provider:
          $ref: "#/components/schemas/ProviderId"
        eligible:
          type: boolean
        reasons:
          type: array
          items:
            type: string
        model:
          type: string
        effort:
          type: string
        running:
          type: integer
        max_concurrent:
          type: integer
        status:
          type: string
    TaskResolutionField:
      type: object
      description: Resolved evidence for one execution field.
      properties:
        requested:
          type: string
        resolved:
          type: string
        source:
          type: string
          enum: [requested, account, lru, discovered, declared, default]
    TaskResolved:
      type: object
      description: |
        The resolved execution: repo canonicalization, base ref, exact base
        SHA, git policy, and per-field evidence (requested vs resolved and
        how it was chosen). Persisted on the task record.
      properties:
        source:
          type: object
          properties:
            repo:
              type: string
            canonical:
              type: string
            kind:
              type: string
              enum: [github, remote, local]
            slug:
              type: string
            base_ref:
              type: string
            base_sha:
              type: string
        git:
          type: object
        execution:
          type: object
          properties:
            provider:
              $ref: "#/components/schemas/TaskResolutionField"
            account:
              $ref: "#/components/schemas/TaskResolutionField"
            model:
              $ref: "#/components/schemas/TaskResolutionField"
            reasoning_effort:
              $ref: "#/components/schemas/TaskResolutionField"
            candidates:
              type: array
              items:
                $ref: "#/components/schemas/TaskCandidate"
    Task:
      type: object
      required: [id, status, request]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [queued, running, finished, error, cancelled, expired]
        request:
          type: object
          description: The caller's declaration, verbatim.
        resolved:
          $ref: "#/components/schemas/TaskResolved"
        agent_id:
          type: string
        run_id:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
    PreflightResponse:
      type: object
      required: [ok, checks]
      properties:
        ok:
          type: boolean
        checks:
          type: array
          items:
            $ref: "#/components/schemas/TaskCheck"
        warnings:
          type: array
          items:
            type: string
        resolved:
          $ref: "#/components/schemas/TaskResolved"
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    CreateTaskResponse:
      type: object
      required: [task, agent, run]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        agent:
          $ref: "#/components/schemas/Agent"
        run:
          type: object
    TaskList:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
    TaskDetail:
      type: object
      required: [task]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        agent:
          $ref: "#/components/schemas/Agent"
        run:
          type: object
    CreateTaskRunRequest:
      type: object
      required: [prompt]
      description: Follow-up turn on the task's agent.
      properties:
        prompt:
          $ref: "#/components/schemas/Prompt"
        on_busy:
          type: string
          enum: [queue, reject]
          default: queue
        metadata:
          $ref: "#/components/schemas/WorkflowMetadata"
        output_contract:
          $ref: "#/components/schemas/OutputContract"
    RetryTaskRequest:
      type: object
      description: |
        ``mode=None`` picks by task state: ``delivery_failed`` retries the
        publish; a terminal run verdict re-runs the task's prompt.
      properties:
        mode:
          type: string
          enum: [delivery, run]
        prompt:
          $ref: "#/components/schemas/Prompt"
        on_busy:
          type: string
          enum: [queue, reject]
          default: queue
    DeliverRequest:
      type: object
      description: Deliver a revision — optional ref + delivery overrides.
      properties:
        revision:
          type: string
          description: "``latest`` | ``rev-…`` | ``n``"
        branch:
          type: string
        pull_request:
          $ref: "#/components/schemas/TaskPullRequest"
    ReviewFinding:
      type: object
      required: [message]
      properties:
        severity:
          type: string
        path:
          type: string
        line:
          type: integer
        message:
          type: string
        code:
          type: string
    ReviewerRef:
      type: object
      description: Reviewer identity — the durable record of who reviewed.
      properties:
        identity:
          type: string
        agent_id:
          type: string
        run_id:
          type: string
    ReviewRequest:
      type: object
      required: [verdict]
      properties:
        revision:
          type: string
        verdict:
          type: string
          enum: [approve, request_changes, comment]
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ReviewFinding"
        reviewer:
          $ref: "#/components/schemas/ReviewerRef"
        comment:
          type: string
          description: Post a machine-readable comment on the delivered PR.
    MergeRequest:
      type: object
      properties:
        revision:
          type: string
          description: "``latest`` | ``rev-…`` | ``n``"
    Revision:
      type: object
      required: [id, n, agent_id, status]
      description: |
        SOR-225: one durable run-result row. ``delivery`` is null until a
        deliver attempt; then ``{status, branch, pushed_head_sha,
        pull_request, error, delivered_at, merged, merge_commit_sha,
        merged_at}``.
      properties:
        id:
          type: string
        n:
          type: integer
          minimum: 1
          description: Per-agent sequence; ``latest`` resolves the highest n.
        agent_id:
          type: string
        task_id:
          type: string
        run_id:
          type: string
        artifact_id:
          type: string
        repo:
          type: string
        base_sha:
          type: string
        head_sha:
          type: string
        status:
          type: string
          enum: [ready, materialization_failed]
        error:
          type: object
        delivery:
          type: object
        created_at:
          type: string
        updated_at:
          type: string
    Review:
      type: object
      required: [id, revision_id, agent_id, verdict, independent]
      description: |
        SOR-225: one durable review row. ``independent`` is computed at
        write time; ``stale`` flips when a newer revision materializes.
      properties:
        id:
          type: string
        revision_id:
          type: string
        agent_id:
          type: string
          description: The revision's author agent (denormalized).
        reviewer:
          $ref: "#/components/schemas/ReviewerRef"
        verdict:
          type: string
          enum: [approve, request_changes, comment]
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ReviewFinding"
        reviewed_head_sha:
          type: string
        independent:
          type: boolean
        stale:
          type: boolean
        comment_url:
          type: string
        created_at:
          type: string
  responses:
    Unauthorized:
      description: Missing or invalid Bearer key (401 unauthorized)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Forbidden:
      description: Valid key without the required `admin` scope (403 forbidden)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotFound:
      description: Resource not found (404 not_found)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    WorkspaceConflict:
      description: |
        409 workspace/artifact domain failure (SOR-83):
        `workspace_not_found`, `repo_unavailable`, `checkout_failed`,
        `base_sha_mismatch`, `head_sha_mismatch`, `checksum_mismatch`,
        `artifact_invalid`, `artifact_secret`, or `review_required` —
        always explicit, never a silent mislabel or redact-and-ship.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    InvalidProvider:
      description: Unknown provider or malformed request (400 invalid_provider)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    AccountUnavailable:
      description: |
        409 when a named account cannot take the run: `account_busy`
        (no free slot) or `account_unavailable` (not `active`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Exhausted:
      description: |
        429 when capacity is exhausted: `provider_exhausted` (auto pick found
        no free account) or `concurrency_limit` (global cap). `retry_after`
        in the error body when known.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    GitHubAppUnconfigured:
      description: |
        503 github_app_unconfigured — no GitHub App identity/private key is
        configured (SOR-177). The GH_TOKEN compatibility bridge may still
        supply tokens.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    GitHubAppInvalid:
      description: |
        400 github_app_invalid — malformed authorize callback (bad
        installation_id / missing state).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    GitHubAppState:
      description: |
        403 github_app_state — the authorize `state` is absent, unknown,
        expired, or already consumed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    GitHubAppConfigured:
      description: |
        409 github_app_configured — a GitHub App is already configured
        for this deployment (SOR-220 manifest registration refused).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Unavailable:
      description: |
        503 `unavailable` — a backend/dependency needed for the request is
        down (e.g. no backend for credential refresh).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Conflict:
      description: Generic 409 domain conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    GitHubAppUpstream:
      description: |
        502 github_app_upstream — a GitHub API call failed (installations
        list, repo selection, installation-token mint, delete).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
