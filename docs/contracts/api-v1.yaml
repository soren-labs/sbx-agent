        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/accounts/{id}/lifecycle:
    get:
      tags: [accounts]
      summary: Non-secret credential lifecycle metadata (admin scope)
      operationId: accountCredentialLifecycle
      description: |
        SOR-176: states ``healthy`` / ``access_expiring`` / ``refreshing`` /
