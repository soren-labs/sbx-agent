components:
  schemas:
    Apply:
      additionalProperties: false
      properties:
        generation:
          minimum: 0.0
          title: Generation
          type: integer
        session_id:
          title: Session Id
          type: string
        subject_digest:
          title: Subject Digest
          type: string
      required:
      - generation
      - session_id
      - subject_digest
      title: Apply
      type: object
    Capture:
      additionalProperties: false
      properties:
        generation:
          minimum: 0.0
          title: Generation
          type: integer
        origin:
          default: explicit
          enum:
          - automatic
          - explicit
          - salvage
          title: Origin
          type: string
        source_turn_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Turn Id
      required:
      - generation
      title: Capture
      type: object
    ConnectionCreate:
      additionalProperties: false
      properties:
        credential:
          additionalProperties:
            type: string
          title: Credential
          type: object
          writeOnly: true
        kind:
          enum:
          - modal
          - github
          - opencode_zen
          title: Kind
          type: string
        label:
          default: ''
          maxLength: 200
          title: Label
          type: string
      required:
      - kind
      - credential
      title: ConnectionCreate
      type: object
    ConnectionView:
      additionalProperties: false
      properties:
        health:
          title: Health
          type: string
        id:
          title: Id
          type: string
        kind:
          title: Kind
          type: string
        label:
          title: Label
          type: string
        state:
          title: State
          type: string
        version:
          title: Version
          type: integer
        workspace_id:
          title: Workspace Id
          type: string
      required:
      - id
      - workspace_id
      - kind
      - label
      - state
      - version
      - health
      title: ConnectionView
      type: object
    CredentialReplace:
      additionalProperties: false
      properties:
        credential:
          additionalProperties:
            type: string
          title: Credential
          type: object
          writeOnly: true
        expected_version:
          title: Expected Version
          type: integer
      required:
      - expected_version
      - credential
      title: CredentialReplace
      type: object
    DeliveryCreate:
      additionalProperties: false
      properties:
        automatic:
          default: false
          title: Automatic
          type: boolean
        base_ref:
          default: main
          title: Base Ref
          type: string
        github_connection_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Github Connection Id
        transport:
          default: pull_request
          enum:
          - pull_request
          - git_branch
          - export
          title: Transport
          type: string
      title: DeliveryCreate
      type: object
    FileWrite:
      additionalProperties: false
      properties:
        content:
          maxLength: 4000000
          title: Content
          type: string
        digest:
          anyOf:
          - type: string
          - type: 'null'
          title: Digest
        generation:
          minimum: 0.0
          title: Generation
          type: integer
        path:
          title: Path
          type: string
      required:
      - generation
      - path
      - content
      title: FileWrite
      type: object
    Generation:
      additionalProperties: false
      properties:
        generation:
          minimum: 0.0
          title: Generation
          type: integer
      required:
      - generation
      title: Generation
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    Login:
      additionalProperties: false
      properties:
        email:
          maxLength: 254
          title: Email
          type: string
        password:
          maxLength: 1024
          minLength: 8
          title: Password
          type: string
          writeOnly: true
      required:
      - email
      - password
      title: Login
      type: object
    Merge:
      additionalProperties: false
      properties:
        expected_base:
          anyOf:
          - type: string
          - type: 'null'
          title: Expected Base
        expected_head:
          title: Expected Head
          type: string
        expected_version:
          title: Expected Version
          type: integer
        method:
          default: squash
          enum:
          - squash
          - merge
          - rebase
          title: Method
          type: string
        subject_digest:
          title: Subject Digest
          type: string
      required:
      - expected_version
      - subject_digest
      - expected_head
      title: Merge
      type: object
    Message:
      additionalProperties: false
      properties:
        content:
          maxLength: 100000
          minLength: 1
          title: Content
          type: string
        routing:
          default: queue
          enum:
          - queue
          - note
          - steer
          title: Routing
          type: string
        settings:
          additionalProperties: true
          title: Settings
          type: object
      required:
      - content
      title: Message
      type: object
    MessageView:
      properties:
        content:
          title: Content
          type: string
        id:
          title: Id
          type: string
        ordinal:
          title: Ordinal
          type: integer
        routing:
          title: Routing
          type: string
      required:
      - id
      - content
      - ordinal
      - routing
      title: MessageView
      type: object
    PartView:
      properties:
        content:
          title: Content
          type: string
        execution_id:
          title: Execution Id
          type: string
        id:
          title: Id
          type: string
        kind:
          title: Kind
          type: string
        revision:
          title: Revision
          type: integer
      required:
      - id
      - execution_id
      - kind
      - revision
      - content
      title: PartView
      type: object
    PasswordChange:
      additionalProperties: false
      properties:
        current_password:
          title: Current Password
          type: string
        password:
          maxLength: 1024
          minLength: 8
          title: Password
          type: string
          writeOnly: true
      required:
      - current_password
      - password
      title: PasswordChange
      type: object
    ProjectCreate:
      additionalProperties: false
      properties:
        base_ref:
          default: main
          title: Base Ref
          type: string
        name:
          default: Project
          maxLength: 200
          title: Name
          type: string
        repository:
          title: Repository
          type: string
        spec:
          additionalProperties: true
          title: Spec
          type: object
      required:
      - repository
      title: ProjectCreate
      type: object
    ProjectPublish:
      additionalProperties: false
      properties:
        base_ref:
          default: main
          title: Base Ref
          type: string
        expected_version:
          title: Expected Version
          type: integer
        name:
          default: Project
          maxLength: 200
          title: Name
          type: string
        repository:
          title: Repository
          type: string
        spec:
          additionalProperties: true
          title: Spec
          type: object
      required:
      - repository
      - expected_version
      title: ProjectPublish
      type: object
    Publish:
      additionalProperties: false
      properties:
        turn_id:
          title: Turn Id
          type: string
      required:
      - turn_id
      title: Publish
      type: object
    SessionCreate:
      additionalProperties: false
      properties:
        backend:
          default: modal
          enum:
          - modal
          - local
          title: Backend
          type: string
        base_ref:
          default: main
          title: Base Ref
          type: string
        github_connection_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Github Connection Id
        message:
          anyOf:
          - $ref: '#/components/schemas/Message'
          - type: 'null'
        modal_connection_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Modal Connection Id
        model:
          default: ''
          title: Model
          type: string
        project_version_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Project Version Id
        provider_id:
          const: opencode
          default: opencode
          title: Provider Id
          type: string
        repository:
          anyOf:
          - type: string
          - type: 'null'
          title: Repository
        title:
          default: New session
          maxLength: 200
          title: Title
          type: string
        zen_connection_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Zen Connection Id
      title: SessionCreate
      type: object
    SessionPatch:
      additionalProperties: false
      properties:
        expected_version:
          title: Expected Version
          type: integer
        title:
          maxLength: 200
          title: Title
          type: string
      required:
      - expected_version
      - title
      title: SessionPatch
      type: object
    SessionView:
      properties:
        creator_id:
          title: Creator Id
          type: string
        effective_inputs:
          additionalProperties: true
          title: Effective Inputs
          type: object
        event_watermark:
          title: Event Watermark
          type: integer
        id:
          title: Id
          type: string
        lifecycle:
          title: Lifecycle
          type: string
        messages:
          items:
            $ref: '#/components/schemas/MessageView'
          title: Messages
          type: array
        parts:
          items:
            $ref: '#/components/schemas/PartView'
          title: Parts
          type: array
        project_version_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Project Version Id
        provider_id:
          title: Provider Id
          type: string
        role:
          title: Role
          type: string
        title:
          title: Title
          type: string
        turns:
          items:
            $ref: '#/components/schemas/TurnView'
          title: Turns
          type: array
        version:
          title: Version
          type: integer
        workspace_id:
          title: Workspace Id
          type: string
        worktree:
          $ref: '#/components/schemas/WorktreeView'
      required:
      - id
      - workspace_id
      - creator_id
      - title
      - role
      - lifecycle
      - version
      - provider_id
      - effective_inputs
      - event_watermark
      - worktree
      - turns
      - messages
      - parts
      title: SessionView
      type: object
    Spawn:
      additionalProperties: false
      properties:
        changeset_id:
          title: Changeset Id
          type: string
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        role:
          default: review
          enum:
          - review
          - test
          - research
          - integration
          title: Role
          type: string
        summary:
          default: ''
          maxLength: 10000
          title: Summary
          type: string
      required:
      - changeset_id
      title: Spawn
      type: object
    TerminalOpen:
      additionalProperties: false
      properties:
        command:
          items:
            type: string
          title: Command
          type: array
      title: TerminalOpen
      type: object
    TurnView:
      properties:
        evidence_complete:
          title: Evidence Complete
          type: boolean
        id:
          title: Id
          type: string
        ordinal:
          title: Ordinal
          type: integer
        outcome:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Outcome
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        session_id:
          title: Session Id
          type: string
        settings:
          additionalProperties: true
          title: Settings
          type: object
        state:
          title: State
          type: string
      required:
      - id
      - ordinal
      - session_id
      - state
      - evidence_complete
      - settings
      title: TurnView
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    Version:
      additionalProperties: false
      properties:
        expected_version:
          title: Expected Version
          type: integer
      required:
      - expected_version
      title: Version
      type: object
    Wait:
      additionalProperties: false
      properties:
        seconds:
          default: 600
          maximum: 3600.0
          minimum: 1.0
          title: Seconds
          type: integer
      title: Wait
      type: object
    WorktreeView:
      properties:
        availability:
          title: Availability
          type: string
        base_sha:
          anyOf:
          - type: string
          - type: 'null'
          title: Base Sha
        generation:
          title: Generation
          type: integer
        id:
          title: Id
          type: string
        last_snapshot_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Snapshot Id
      required:
      - id
      - generation
      - availability
      title: WorktreeView
      type: object
