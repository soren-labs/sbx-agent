name: Staging image

# Builds the backend candidate image for every commit on main. The staging
# host only pulls this image by digest; it never builds. This workflow does
# not deploy anything and holds no staging or production credentials.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging-image-${{ github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: soren-labs/sbx-agent

jobs:
  image:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `staging-<sha>` never collides with the release workflow's `v*` and
      # `sha-<sha>` tags, which production resolves to its own digest.
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
          build-args: |
            SBX_VERSION=staging-${{ github.sha }}
            SBX_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record candidate
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Staging candidate"
            echo
            echo "- git sha: \`${GITHUB_SHA}\`"
            echo "- image: \`${REGISTRY}/${IMAGE_NAME}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
