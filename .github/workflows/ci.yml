name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: make lint

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sbx
          POSTGRES_PASSWORD: sbx
          POSTGRES_DB: sbx_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sbx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SBX_TEST_DATABASE_URL: postgresql://sbx:sbx@127.0.0.1:5433/sbx_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: make test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
        working-directory: console
      - run: npm run typecheck
        working-directory: console
      - run: npm test
        working-directory: console
      - run: npm run build
        working-directory: console
